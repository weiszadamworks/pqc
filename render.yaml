services:
  - type: web
    name: quantumshield-audit
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOW_PRIVATE_IP_SCAN
        value: "false"
      - key: DEBUG
        value: "false"
